<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>메일링 HTML 템플릿</title>
        <style>
            @media only screen and (max-width: 640px) {
                .email-shell {
                    width: 100% !important;
                }

                .email-cell {
                    padding: 28px 20px !important;
                }

                .email-title {
                    font-size: 24px !important;
                }
            }
        </style>
    </head>

    <body style="margin: 0; padding: 0; background-color: #f4f5f7;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin: 0; padding: 0; border-spacing: 0; border-collapse: collapse; background-color: #f4f5f7;">
            <tr>
                <td align="center" style="padding: 32px 16px;">
                    <!-- 600px는 주요 메일 클라이언트에서 가로 스크롤 없이 안정적으로 표시되는 기본 폭 -->
                    <table class="email-shell" role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width: 600px; max-width: 600px; margin: 0 auto; border-spacing: 0; border-collapse: collapse; background-color: #ffffff;">
                        <tr>
                            <td class="email-cell" style="padding: 36px 40px; border-bottom: 3px solid #333333; font-family: Arial, sans-serif;">
                                <p style="margin: 0; color: #555555; font-size: 14px; font-weight: 700; line-height: 1.4;">SERVICE NAME</p>
                                <h1 class="email-title" style="margin: 12px 0 0; color: #222222; font-size: 28px; font-weight: 700; line-height: 1.4;">메일 제목</h1>
                            </td>
                        </tr>
                        <tr>
                            <td class="email-cell" style="padding: 40px; font-family: Arial, sans-serif;">
                                <p style="margin: 0; color: #333333; font-size: 16px; line-height: 1.8;">안녕하세요, 수신자님.</p>
                                <p style="margin: 20px 0 0; color: #555555; font-size: 16px; line-height: 1.8;">메일 본문 내용을 입력합니다. 주요 색상, 글꼴, 크기와 정렬은 인라인 스타일로 적용합니다.</p>
                                <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" style="margin: 28px auto 0; border-spacing: 0; border-collapse: collapse;">
                                    <tr>
                                        <td align="center" bgcolor="#333333" style="padding: 0;">
                                            <a href="https://example.com" target="_blank" style="display: inline-block; padding: 14px 24px; color: #ffffff; font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; line-height: 1.4; text-align: center; text-decoration: none;">자세히 보기</a>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td class="email-cell" style="padding: 24px 40px; border-top: 1px solid #e5e5e5; font-family: Arial, sans-serif;">
                                <p style="margin: 0; color: #777777; font-size: 12px; line-height: 1.7;">수신 거부와 필수 고지 문구를 입력합니다.</p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
